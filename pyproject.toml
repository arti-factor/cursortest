[project]
name = "gbp-audit"
version = "0.1.0"
description = "Mandantenfähige CLI-App zum Audit von Google-Unternehmensprofilen (GBP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "selectolax>=0.3.17",
    "extruct>=0.17.0",
    "w3lib>=2.1.2",
    "rapidfuzz>=3.9",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "phonenumbers>=8.13",
    "holidays>=0.50",
    "google-auth>=2.29",
    "google-auth-oauthlib>=1.2",
    "tenacity>=8.2",
    "jinja2>=3.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "respx>=0.21",
]

[project.scripts]
gbp-audit = "src.cli:app"
gbp-audit-web = "src.webapp.main:run_dev_server"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
